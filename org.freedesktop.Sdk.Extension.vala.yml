id: org.freedesktop.Sdk.Extension.vala
branch: '24.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '24.08'
separate-locales: false
build-options:
  prefix: /usr/lib/sdk/vala
  prepend-pkg-config-path: /usr/lib/sdk/vala/lib/pkgconfig/
  prepend-path: /usr/lib/sdk/vala/bin/
cleanup:
  - /share/info
  - /share/man
  - /share/doc
  - /share/gir-1.0
  - /lib/girepository-1.0
  - /include
  - '*.la'
  - /share/vala/Makefile.vapigen
  - /lib/libgvpr.so*
  - /share/graphviz/gvpr
modules:
  - name: valac
    buildsystem: autotools
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vala/0.56/vala-0.56.17.tar.xz
        sha256: 26100c4e4ef0049c619275f140d97cf565883d00c7543c82bcce5a426934ed6a
        x-checker-data:
          type: gnome
          name: vala
          stable-only: true
          is-main-source: true
          is-important: true
    run-tests: false
    build-options:
      cppflags: -I/usr/lib/sdk/vala/include/
    modules:
      - name: graphviz
        buildsystem: autotools
        sources:
          - type: archive
            url: https://gitlab.com/graphviz/graphviz/-/archive/10.0.1/graphviz-10.0.1.tar.gz
            sha256: 28f452ef1cb12288c8758a62f8c3fcfefdb91b251f7aae61d0d703f851bde931
            x-checker-data:
              type: anitya
              project-id: 1249
              stable-only: true
              url-template: https://gitlab.com/graphviz/graphviz/-/archive/$version/graphviz-$version.tar.gz
              is-important: false
        cleanup: [/share/graphviz/doc, /bin, /lib/pkgconfig]
      - name: dbus-run-session
        sources:
          - type: archive
            url: https://gitlab.freedesktop.org/dbus/dbus/-/archive/dbus-1.16.0/dbus-dbus-1.16.0.tar.gz
            sha256: d2ca9d958c830e762ba70aea8e6b5c29fa7b58d0fee8ddd9bb5a00f35106ab57
            x-checker-data:
              type: anitya
              project-id: 5356
              stable-only: true
              url-template: https://gitlab.freedesktop.org/dbus/dbus/-/archive/dbus-$version/dbus-dbus-$version.tar.gz
              is-important: false
        buildsystem: autotools
        cleanup: ['*']
  - name: vls
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/vala-lang/vala-language-server/releases/download/0.48.7/vala-language-server-0.48.7.tar.xz
        sha256: a93e09497738144792466d0c5ccb1347583d84a9987b65b08f6aa5d5a1e3f431
        x-checker-data:
          type: anitya
          project-id: 242051
          stable-only: true
          url-template: https://github.com/vala-lang/vala-language-server/releases/download/$version/vala-language-server-$version.tar.xz
          is-important: true
    build-options:
      env: {XDG_DATA_DIRS: /usr/lib/sdk/vala/share/}
    modules:
      - name: jsonrpc
        buildsystem: meson
        sources:
          - type: archive
            url: https://download.gnome.org/sources/jsonrpc-glib/3.44/jsonrpc-glib-3.44.1.tar.xz
            sha256: 1361d17e9c805646afe5102e59baf8ca450238600fcabd01586c654b78bb30df
            x-checker-data:
              type: gnome
              name: jsonrpc-glib
              stable-only: true
              is-important: false
        cleanup: [/lib/pkgconfig]
      - name: gee
        buildsystem: autotools
        build-options:
          # GCC 14 doesn't like this libgee release
          cflags: -Wno-error=incompatible-pointer-types
        sources:
          - type: archive
            url: https://download.gnome.org/sources/libgee/0.20/libgee-0.20.8.tar.xz
            sha256: 189815ac143d89867193b0c52b7dc31f3aa108a15f04d6b5dca2b6adfad0b0ee
            x-checker-data:
              type: gnome
              name: libgee
              stable-only: true
              is-important: false
        cleanup: [/lib/pkgconfig]
      - name: uncrustify
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
        builddir: true
        sources:
          - type: archive
            url: https://github.com/uncrustify/uncrustify/archive/uncrustify-0.78.1.tar.gz
            sha256: ecaf4c0adca14c36dfffa30bc28e69865115ecd602c90eb16a8cddccb41caad2
            x-checker-data:
              type: anitya
              project-id: 5043
              stable-only: true
              url-template: https://github.com/uncrustify/uncrustify/archive/uncrustify-$version.tar.gz
              is-important: false
        cleanup: [/lib/pkgconfig]
  - name: scripts
    buildsystem: simple
    sources:
      - type: script
        commands:
          - export PATH=/usr/lib/sdk/vala/bin/:$PATH
          - export LD_LIBRARY_PATH=/usr/lib/sdk/vala/lib/:$LD_LIBRARY_PATH
        dest-filename: enable.sh
    build-commands:
      - cp enable.sh /usr/lib/sdk/vala/
  - name: appdata
    buildsystem: simple
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.vala.appdata.xml
    build-commands:
      - install -Dm0644 ${FLATPAK_ID}.appdata.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml

